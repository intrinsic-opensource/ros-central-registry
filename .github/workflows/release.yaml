# Triggered manually using the GitHub action interface. It requests
# a release name, in <distribution>/<date>.rcr.<n> where N is an
# integer strictly greater than or equal to one. It then zips the
# documentation and all modules as a release artifact, and finally
# pushes the release name as a tag along with the artifact. The
# maintainer will then go and add some release notes.

