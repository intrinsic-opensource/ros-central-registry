name: baseline_ros_release
run-name: Baseline colcon build and test for coverage and performance
on:
  # TODO(asymingt) - remove.
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      distribution:
        description: 'Which distribution is the release for?'
        required: true
        type: choice
        options:
        - 'jazzy'
        - 'kilted'
        - 'lyrical'
        - 'rolling'
        default: 'lyrical'
      date:
        description: 'Release in YYYY-MM-DD. Default is 2026-06-08.'
        default: '2026-06-08'
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  baseline-new-release:
    permissions:
      pull-requests: write
      contents: write
    name: ${{ matrix.variant }}_${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        variant:
        - ros_core
        # - ros_base
        # - perception
        # - desktop
        # - simulation
        # - desktop_full
        os:
        - ubuntu-26.04
        - ubuntu-26.04-arm
        # - macos-26-intel
        # - macos-26
        # - windows-2025
        # - windows-11-arm
    steps:

    # We must not run setup-python on Linux. setup-python overrides the python3
    # executable pointing to a custom environment that lacks all system python3-*
    # packages installed via apt (e.g. numpy, yaml) which are required to build ROS 2.
    # - name: Set up Python
    #   if: runner.os != 'Linux'
    #   uses: actions/setup-python@v6
    #   with:
    #     python-version: '3.12'

    # On Linux, python3-rosinstall-generator is installed by apt via ros-dev-tools.
    # On macOS and Windows we must install it manually.
    # - name: Install ROS installation tools
    #   if: runner.os != 'Linux'
    #   shell: bash
    #   run: python3 -m pip install rosinstall-generator

    # - name: Set up MSVC
    #   if: runner.os == 'Windows'
    #   uses: ilammy/msvc-dev-cmd@v1

    # - name: Setup ROS
    #   uses: ros-tooling/setup-ros@v0.7

    # Install additional ROS 2 build/testing dependencies on Linux.
    - name: Install ROS 2 build dependencies (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt install software-properties-common
        sudo add-apt-repository universe
        sudo apt update && sudo apt install curl -y
        export ROS_APT_SOURCE_VERSION=$(curl -s https://api.github.com/repos/ros-infrastructure/ros-apt-source/releases/latest | grep -F "tag_name" | awk -F'"' '{print $4}')
        curl -L -o /tmp/ros2-apt-source.deb "https://github.com/ros-infrastructure/ros-apt-source/releases/download/${ROS_APT_SOURCE_VERSION}/ros2-apt-source_${ROS_APT_SOURCE_VERSION}.$(. /etc/os-release && echo ${UBUNTU_CODENAME:-${VERSION_CODENAME}})_all.deb"
        sudo dpkg -i /tmp/ros2-apt-source.deb
        sudo apt-get update
        sudo apt-get install -y \
          python3-mypy \
          python3-pip \
          python3-pytest \
          python3-pytest-cov \
          python3-pytest-mock \
          python3-pytest-repeat \
          python3-pytest-rerunfailures \
          python3-pytest-runner \
          python3-pytest-timeout \
          ros-dev-tools
        sudo rosdep init
        rosdep update
        python3 -m pip install rosinstall-generator

    - name: Parse release and configure ROSDISTRO_INDEX_URL and DISTRO
      shell: bash
      run: |
        INPUT_DISTRIBUTION="${{ inputs.distribution }}"
        INPUT_DISTRIBUTION="${INPUT_DISTRIBUTION:-lyrical}"
        INPUT_DATE="${{ inputs.date }}"
        INPUT_DATE="${INPUT_DATE:-2026-06-08}"
        RELEASE_NAME="${INPUT_DISTRIBUTION}/${INPUT_DATE}"
        echo "DISTRO=${INPUT_DISTRIBUTION}" >> $GITHUB_ENV
        echo "ROSDISTRO_INDEX_URL=https://github.com/asymingt/rosdistro/releases/download/${RELEASE_NAME}/index-v4.yaml" >> $GITHUB_ENV

    - name: Generate repos file and import sources
      shell: bash
      run: |
        python3 -c "import sys; from rosinstall_generator.cli import main; sys.exit(main())" ${{ matrix.variant }} --rosdistro ${{ env.DISTRO }} --deps > ros2.repos
        mkdir -p src
        vcs import src < ros2.repos

    - name: Install system dependencies using rosdep
      shell: bash
      run: |
          rosdep install --from-paths src --ignore-src -y --skip-keys "fastcdr rti-connext-dds-7.7.0 urdfdom_headers" --rosdistro ${{ env.DISTRO }}

    - name: Colcon Build
      shell: bash
      run: |
        start_time=$(date +%s)
        colcon build --symlink-install --packages-up-to ${{ matrix.variant }}
        end_time=$(date +%s)
        duration=$((end_time - start_time))
        echo "### Build Duration: ${duration} seconds" >> $GITHUB_STEP_SUMMARY

    - name: Colcon Test
      shell: bash
      run: |
        start_time=$(date +%s)
        colcon test --packages-up-to ${{ matrix.variant }}
        end_time=$(date +%s)
        duration=$((end_time - start_time))
        echo "### Test Duration: ${duration} seconds" >> $GITHUB_STEP_SUMMARY

    - name: Archive Test Results (JUnit XML)
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: test-results-${{ matrix.variant }}-${{ matrix.os }}
        path: |
          build/**/*.xml