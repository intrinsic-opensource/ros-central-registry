name: check_deployment
run-name: Checks documents build and deploys if necessary

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  ANDROID_HOME: ""

jobs:
  check_deployment: 
    runs-on: ubuntu-26.04
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - name: Setup Bazel
      uses: bazel-contrib/setup-bazel@0.19.0
      with:
        bazelisk-cache: true
        disk-cache: ${{ github.workflow }}
        repository-cache: false
    - name: Regenerate docs
      run: bazel build //docs:html
    - name: Merge docs, modules and bcr_staging
      run: |
        mkdir -p ./deploy/modules
        touch ./deploy/.nojekyll
        echo -e "{\n\t\"mirrors\": []\n}" > ./deploy/bazel_registry.json
        tar -xzvf bazel-bin/docs/html_docs.tar.gz -C ./deploy 
        cp -R ./bcr_staging/modules/* deploy/modules
        cp -R ./modules/* deploy/modules
    - name: Deploy to github pages
      if: github.ref == 'refs/heads/main'
      uses: JamesIves/github-pages-deploy-action@v4
      with:
        folder: deploy
    - name: Notify the RCR-UI to rebuild
      if: github.ref == 'refs/heads/main'
      uses: peter-evans/repository-dispatch@v4
      with:
        token: ${{ secrets.RCR_UI_PAT_TOKEN }}
        repository: intrinsic-opensource/rcr-ui
        event-type: on-rcr-trigger
    - name: Update status badges
      uses: Schneegans/dynamic-badges-action@v1.8.0
      with:
        auth: ${{ secrets.STATUS_BADGE_SECRET }}
        gistID: f796805a77e0f05cc837b18e60142773
        filename: deployment.json
        label: deployment
        message: ${{ job.status == 'success' && '✓' || 'x' }}
        color: ${{ job.status == 'success' && 'green' || 'red' }}
      if: always() # TODO(fix)
