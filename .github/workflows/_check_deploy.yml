# Reusable workflow: builds and publishes the docs site + notifies the
# RCR-UI to rebuild. Called (never triggered directly) from ci.yaml as the
# final stage, gated on every earlier stage (lint, tooling, modules, docs
# build check, distribution, ros_release) having succeeded first. Docs are
# rebuilt fresh here rather than reusing _check_docs_build.yml's output --
# they share a disk-cache key, so this should mostly be a cache hit rather
# than a full recompile.
#
# The actual publish + notify steps only fire when github.ref is
# refs/heads/main, same guard as the original check_deployment.yaml -- on
# a pull_request or a workflow_dispatch off a non-main ref, this job still
# runs (as a final consistency check) but is a no-op beyond that.

name: _check_deploy

on:
  workflow_call:

env:
  ANDROID_HOME: ""

jobs:
  check_deploy:
    name: Deploy docs
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - name: Setup Bazel
      uses: bazel-contrib/setup-bazel@0.19.0
      with:
        bazelisk-cache: true
        disk-cache: check_deployment
        repository-cache: true
    - name: Regenerate docs
      run: bazel build //docs:html
    - name: Merge docs, modules and bcr_staging
      run: |
        mkdir -p ./deploy/modules
        touch ./deploy/.nojekyll
        echo -e "{\n\t\"mirrors\": []\n}" > ./deploy/bazel_registry.json
        tar -xzvf bazel-bin/docs/html_docs.tar.gz -C ./deploy
        cp -R ./bcr_staging/modules/* deploy/modules
        cp -R ./modules/* deploy/modules
    - name: Deploy to github pages
      if: github.ref == 'refs/heads/main'
      uses: JamesIves/github-pages-deploy-action@v4
      with:
        folder: deploy
    - name: Notify the RCR-UI to rebuild
      if: github.ref == 'refs/heads/main'
      uses: peter-evans/repository-dispatch@v4
      with:
        token: ${{ secrets.RCR_UI_PAT_TOKEN }}
        repository: intrinsic-opensource/rcr-ui
        event-type: on-rcr-trigger
    - name: Update status badges
      uses: Schneegans/dynamic-badges-action@v1.8.0
      with:
        auth: ${{ secrets.STATUS_BADGE_SECRET }}
        gistID: f796805a77e0f05cc837b18e60142773
        filename: deployment.json
        label: deployment
        message: ${{ job.status == 'success' && '✓' || 'x' }}
        color: ${{ job.status == 'success' && 'green' || 'red' }}
      if: always() # TODO(fix)
