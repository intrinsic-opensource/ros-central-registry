name: check_distribution
run-name: Perform a build across platforms, bazel versions and variants.

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch name.'
        default: 'lyrical.2026-06-08.rcr.1'
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ inputs.branch || github.ref }}
  cancel-in-progress: true

env:
  ANDROID_HOME: ""

jobs:
  checkout-setup-build-test:
    permissions:
      actions: read
      checks: write
      contents: read
      id-token: write
    name: ${{ matrix.ros }}_${{ matrix.variant }}_${{ matrix.bazel }}_${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: workspace
        shell: bash
    env:
      USE_BAZEL_VERSION: ${{ matrix.bazel }}
    strategy:
      fail-fast: false
      matrix:
        bazel:
        - 8.x
        - 9.x
        ros:
        - lyrical.2026-06-08.rcr.1
        variant:
        - perception
        os:
        - ubuntu-26.04
        - ubuntu-26.04-arm
        - macos-26-intel
        - macos-26
    steps:
    - name: Free disk space
      if: runner.os == 'Linux'
      uses: jlumbroso/free-disk-space@v1.3.1
      with:
        tool-cache: true
        android: true
        dotnet: true
        haskell: true
        large-packages: true
        docker-images: true
        swap-storage: true
  
    # Setup bazel with controlled caching
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
        ref: ${{ inputs.branch || github.ref }}

    # Setup auth to allow pushing to the remote cache.
    - name: Authenticate to Google Cloud
      uses: "google-github-actions/auth@v3"
      with:
        workload_identity_provider: projects/771457463613/locations/global/workloadIdentityPools/github-automation/providers/build-dev
        service_account: github-automation-bot@gha-intrinsic-opensource-rcr.iam.gserviceaccount.com
        create_credentials_file: true

    # Setup bazel with controlled caching
    - name: Setup Bazel
      uses: bazel-contrib/setup-bazel@0.19.0
      with:
        bazelisk-cache: true
        disk-cache: ${{ github.workflow }}
        repository-cache: false

    # SMOKE TEST

    # Checks that the examples build, for both dynamic and static RMW implementations.
    - name: Examples
      id: examples
      working-directory: ./examples
      run: |
        bazel build //:example_ros_publisher_cc --dynamic_mode=off --@rosdistro//:rmw=rmw_fastrtps_cpp
        bazel build //:example_ros_publisher_cc --dynamic_mode=off --@rosdistro//:rmw=rmw_fastrtps_dynamic_cpp
        bazel build //:example_ros_publisher_cc --dynamic_mode=off --@rosdistro//:rmw=rmw_cyclonedds_cpp
        bazel build //:example_ros_publisher_cc --dynamic_mode=off --@rosdistro//:rmw=rmw_zenoh_cpp
        bazel build //...
    - name: Update status badge (build)
      uses: Schneegans/dynamic-badges-action@v1.8.0
      with:
        auth: ${{ secrets.STATUS_BADGE_SECRET }}
        gistID: f796805a77e0f05cc837b18e60142773
        filename: ${{ matrix.ros }}_${{ matrix.bazel }}_${{ matrix.os }}_examples.json
        label: ${{ matrix.bazel }}
        message: ${{ steps.examples.outcome == 'success' && '✓' || 'x' }}
        color: ${{ steps.examples.outcome == 'success' && 'green' || 'red' }}
      if: always() # TODO(fix)

    # TEST THE ENTIRE DISTRIBUTION

    # Setup python
    - name: Setup Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'

    # Prepare the bazel workspace
    - name: Prepare workspace
      id: prepare_workspace
      working-directory: .
      run: |
        python3 tools/ci/setup_workspace.py --release ${{ matrix.ros }}

    # Build the ros 2 distribution
    - name: Build
      id: build
      run: |
        bazel build --config ci --config=${{ matrix.variant }} 2>&1 | tee build.log
    - name: Update status badge (build)
      uses: Schneegans/dynamic-badges-action@v1.8.0
      with:
        auth: ${{ secrets.STATUS_BADGE_SECRET }}
        gistID: f796805a77e0f05cc837b18e60142773
        filename: ${{ matrix.ros }}_${{ matrix.variant }}_${{ matrix.bazel }}_${{ matrix.os }}_build.json
        label: ${{ matrix.bazel }}
        message: ${{ steps.build.outcome == 'success' && '✓' || 'x' }}
        color: ${{ steps.build.outcome == 'success' && 'green' || 'red' }}
      if: always() # TODO(fix)

    - name: Test (rmw_fastrtps_cpp)
      continue-on-error: true
      id: test_rmw_fastrtps_cpp
      run: |
        bazel test --config ci --config=${{ matrix.variant }} --test_env=RMW_IMPLEMENTATION=rmw_fastrtps_cpp 2>&1 | tee rmw_fastrtps_cpp.test.log || test_status=$?
        if [ -d bazel-testlogs ]; then
          find -L bazel-testlogs -name "*.xml" -print0 | tar -czf ${{ matrix.ros }}_${{ matrix.variant }}_${{ matrix.bazel }}_${{ matrix.os }}_rmw_fastrtps_cpp.xml.tar.gz --null -T - || true
          find -L bazel-testlogs -name "*.log" -print0 | tar -czf ${{ matrix.ros }}_${{ matrix.variant }}_${{ matrix.bazel }}_${{ matrix.os }}_rmw_fastrtps_cpp.log.tar.gz --null -T - || true
        fi
        exit ${test_status:-0}
    - name: Update status badge (rmw_fastrtps_cpp)
      uses: Schneegans/dynamic-badges-action@v1.8.0
      with:
        auth: ${{ secrets.STATUS_BADGE_SECRET }}
        gistID: f796805a77e0f05cc837b18e60142773
        filename: ${{ matrix.ros }}_${{ matrix.variant }}_${{ matrix.bazel }}_${{ matrix.os }}_test_rmw_fastrtps_cpp.json
        label: ${{ matrix.bazel }}
        message: ${{ steps.test_rmw_fastrtps_cpp.outcome == 'success' && '✓' || 'x' }}
        color: ${{ steps.test_rmw_fastrtps_cpp.outcome == 'success' && 'green' || 'red' }}
      if: always() # TODO(fix)

    - name: Test (rmw_fastrtps_dynamic_cpp)
      id: test_rmw_fastrtps_dynamic_cpp
      continue-on-error: true
      run: |
        bazel test --config ci --config=${{ matrix.variant }} --test_env=RMW_IMPLEMENTATION=rmw_fastrtps_dynamic_cpp 2>&1 | tee rmw_fastrtps_dynamic_cpp.test.log || test_status=$?
        if [ -d bazel-testlogs ]; then
          find -L bazel-testlogs -name "*.xml" -print0 | tar -czf ${{ matrix.ros }}_${{ matrix.variant }}_${{ matrix.bazel }}_${{ matrix.os }}_rmw_fastrtps_dynamic_cpp.xml.tar.gz --null -T - || true
          find -L bazel-testlogs -name "*.log" -print0 | tar -czf ${{ matrix.ros }}_${{ matrix.variant }}_${{ matrix.bazel }}_${{ matrix.os }}_rmw_fastrtps_dynamic_cpp.log.tar.gz --null -T - || true
        fi
        exit ${test_status:-0}
    - name: Update status badge (rmw_fastrtps_dynamic_cpp)
      uses: Schneegans/dynamic-badges-action@v1.8.0
      with:
        auth: ${{ secrets.STATUS_BADGE_SECRET }}
        gistID: f796805a77e0f05cc837b18e60142773
        filename: ${{ matrix.ros }}_${{ matrix.variant }}_${{ matrix.bazel }}_${{ matrix.os }}_test_rmw_fastrtps_dynamic_cpp.json
        label: ${{ matrix.bazel }}
        message: ${{ steps.test_rmw_fastrtps_dynamic_cpp.outcome == 'success' && '✓' || 'x' }}
        color: ${{ steps.test_rmw_fastrtps_dynamic_cpp.outcome == 'success' && 'green' || 'red' }}
      if: always() # TODO(fix)

    - name: Test (rmw_cyclonedds_cpp)
      id: test_rmw_cyclonedds_cpp
      continue-on-error: true
      run: |
        bazel test --config ci --config=${{ matrix.variant }} --test_env=RMW_IMPLEMENTATION=rmw_cyclonedds_cpp 2>&1 | tee rmw_cyclonedds_cpp.test.log || test_status=$?
        if [ -d bazel-testlogs ]; then
          find -L bazel-testlogs -name "*.xml" -print0 | tar -czf ${{ matrix.ros }}_${{ matrix.variant }}_${{ matrix.bazel }}_${{ matrix.os }}_rmw_cyclonedds_cpp.xml.tar.gz --null -T - || true
          find -L bazel-testlogs -name "*.log" -print0 | tar -czf ${{ matrix.ros }}_${{ matrix.variant }}_${{ matrix.bazel }}_${{ matrix.os }}_rmw_cyclonedds_cpp.log.tar.gz --null -T - || true
        fi
        exit ${test_status:-0}
    - name: Update status badge (rmw_cyclonedds_cpp)
      uses: Schneegans/dynamic-badges-action@v1.8.0
      with:
        auth: ${{ secrets.STATUS_BADGE_SECRET }}
        gistID: f796805a77e0f05cc837b18e60142773
        filename: ${{ matrix.ros }}_${{ matrix.variant }}_${{ matrix.bazel }}_${{ matrix.os }}_test_rmw_cyclonedds_cpp.json
        label: ${{ matrix.bazel }}
        message: ${{ steps.test_rmw_cyclonedds_cpp.outcome == 'success' && '✓' || 'x' }}
        color: ${{ steps.test_rmw_cyclonedds_cpp.outcome == 'success' && 'green' || 'red' }}
      if: always() # TODO(fix)

    - name: Test (rmw_zenoh_cpp)
      id: test_rmw_zenoh_cpp
      continue-on-error: true
      run: |
        bazel run @rmw_zenoh_cpp//:rmw_zenohd 2>zenohd-stderr.log 1>zenohd-stdout.log &
        ZENOHD_PID=$!
        trap "kill $ZENOHD_PID 2>/dev/null || true" EXIT
        bazel test --config ci --config=${{ matrix.variant }} --test_env=RMW_IMPLEMENTATION=rmw_zenoh_cpp 2>&1 | tee rmw_zenoh_cpp.test.log || test_status=$?
        if [ -d bazel-testlogs ]; then
          find -L bazel-testlogs -name "*.xml" -print0 | tar -czf ${{ matrix.ros }}_${{ matrix.variant }}_${{ matrix.bazel }}_${{ matrix.os }}_rmw_zenoh_cpp.xml.tar.gz --null -T - || true
          find -L bazel-testlogs -name "*.log" -print0 | tar -czf ${{ matrix.ros }}_${{ matrix.variant }}_${{ matrix.bazel }}_${{ matrix.os }}_rmw_zenoh_cpp.log.tar.gz --null -T - || true
        fi
        exit ${test_status:-0}
    - name: Update status badge (rmw_zenoh_cpp)
      uses: Schneegans/dynamic-badges-action@v1.8.0
      with:
        auth: ${{ secrets.STATUS_BADGE_SECRET }}
        gistID: f796805a77e0f05cc837b18e60142773
        filename: ${{ matrix.ros }}_${{ matrix.variant }}_${{ matrix.bazel }}_${{ matrix.os }}_test_rmw_zenoh_cpp.json
        label: ${{ matrix.bazel }}
        message: ${{ steps.test_rmw_zenoh_cpp.outcome == 'success' && '✓' || 'x' }}
        color: ${{ steps.test_rmw_zenoh_cpp.outcome == 'success' && 'green' || 'red' }}
      if: always() # TODO(fix)

    - name: Test logs
      uses: actions/upload-artifact@v7
      with:
        name: All test logs
        path: |
          workspace/*.xml.tar.gz
          workspace/*.log.tar.gz
          workspace/*.test.log
          workspace/build.log
          workspace/zenohd-stdout.log
          workspace/zenohd-stderr.log
      if: always()