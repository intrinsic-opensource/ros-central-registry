name: check_examples_build
run-name: Checks that the targets in the "examples" folder build.
env:
  ANDROID_HOME: ""
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
jobs:
  check_examples_build:
    name: Checks that the targets in the "examples" folder build.
    runs-on: ubuntu-26.04
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Setup Bazel
      uses: bazel-contrib/setup-bazel@0.15.0
      with:
        bazelisk-cache: true
        disk-cache: ${{ github.workflow }}
        repository-cache: false
    - name: Check that the examples build correctly
      run: |
        cd examples
        bazel build //...
