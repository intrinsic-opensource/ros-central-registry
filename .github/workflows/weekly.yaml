# Triggered once a week on Sunday at midnight to roll up all changes from
# the week into a patch release. For example, let's say during the last
# week, a new patch version of rcl was released with version 1.3.0.rcr.2
# as well as a new version of rclpy with version 1.4.5.rcr.6. The patch
# rollup process will create a new patch release for the distributions
# affected by these new module versions. Let's say the previous release was
# lyrical.2026-06-08.rcr.1 it will now create lyrical.2026-06-15.rcr.2. with
# rcl@1.3.0.rcr.2 and rclpy@1.4.5.rcr.6. It then runs a full test across
# all supported OS, microarchitecures, bazel versions and RMW to make
# sure that the release passes. If so, it commits the new set of modules
# to the repo, making sure to only ADD module versions.