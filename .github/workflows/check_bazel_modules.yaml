name: check_bazel_modules
run-name: Checks that changes to Bazel modules abide by certain rules

on:
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  ANDROID_HOME: ""

jobs:
  check_bazel_modules:
    name: Check PR rules on ${{ matrix.directory }}
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        directory: ["modules", "bcr_staging/modules"]
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - name: Setup Bazel
      uses: bazel-contrib/setup-bazel@0.19.0
      with:
        bazelisk-cache: true
        disk-cache: ${{ github.workflow }}
        repository-cache: true
    - name: Generate PR diff and old metadata files
      run: |
        # Generate the diff name-status file
        git diff --name-status "origin/${{ github.base_ref }}...HEAD" > /tmp/diff_status.txt
        
        # Extract the old versions of any modified metadata.json files under the matrix directory
        mkdir -p /tmp/old_metadata
        git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep "^${{ matrix.directory }}/[^/]*/metadata.json$" | while read -r file; do
            mkdir -p "/tmp/old_metadata/$(dirname "$file")"
            git show "origin/${{ github.base_ref }}:$file" > "/tmp/old_metadata/$file" || true
        done
    - name: Run PR modules check
      run: |
        bazel run //tools/ci:check_pr_modules -- \
            --diff-status /tmp/diff_status.txt \
            --old-metadata-dir /tmp/old_metadata \
            --directory "${{ matrix.directory }}"
    - name: Update status badges
      uses: Schneegans/dynamic-badges-action@v1.8.0
      with:
        auth: ${{ secrets.STATUS_BADGE_SECRET }}
        gistID: f796805a77e0f05cc837b18e60142773
        filename: modules.json
        label: modules
        message: ${{ job.status == 'success' && '✓' || 'x' }}
        color: ${{ job.status == 'success' && 'green' || 'red' }}
      if: always() # TODO(fix)
