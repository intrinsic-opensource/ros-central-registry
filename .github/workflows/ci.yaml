# This is the single staged pipeline for the repo, built out of the
# reusable workflows in this directory (the _check_*.yml files).

name: ci
run-name: Lint, test tooling, build and test the distribution, and deploy.

on:
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:

  # Always run, tags PR and provides some boolean values to use to
  # unnlock 
  # changes_docs:
  #   description: "True if documentation changed"
  #   value: ${{ jobs.detect_changes.outputs.changes_docs }}
  # changes_examples:
  #   description: "True if examples changed"
  #   value: ${{ jobs.detect_changes.outputs.changes_examples }}
  # changes_staged:
  #   description: "True if bcr_staging changed"
  #   value: ${{ jobs.detect_changes.outputs.changes_staged }}
  # changes_modules:
  #   description: "True if modules changed"
  #   value: ${{ jobs.detect_changes.outputs.changes_modules }}
  # changes_tooling:
  #   description: "True if tooling changed"
  #   value: ${{ jobs.detect_changes.outputs.changes_tooling }}
  touched:
    name: Check what is touched
    uses: ./.github/workflows/_check_what_is_touched.yml
    secrets: inherit

  lint:
    name: Lint source code
    uses: ./.github/workflows/_check_for_linting_errors.yml
    secrets: inherit

  docs:
    needs: touched
    if: github.event.pull_request.draft == false && needs.touched.outputs.changes_docs == 'true'
    name: Check documentation
    uses: ./.github/workflows/_check_docs_build.yml
    secrets: inherit

  tooling:
    needs: touched
    if: github.event.pull_request.draft == false && needs.touched.outputs.changes_tooling == 'true'
    name: Test tooling
    uses: ./.github/workflows/_check_tooling.yml
    secrets: inherit

  modules:
    needs: touched
    if: github.event.pull_request.draft == false && (needs.touched.outputs.changes_modules == 'true' || needs.touched.outputs.changes_staged == 'true')
    name: Check modules
    uses: ./.github/workflows/_check_bazel_modules.yml
    secrets: inherit

  examples:
    needs:
    - touched
    - lint
    - tooling
    - modules
    if: |
      always() &&
      github.event.pull_request.draft == false &&
      (needs.touched.result == 'success') &&
      (needs.touched.outputs.changes_modules == 'true' || needs.touched.outputs.changes_staged == 'true' || needs.touched.outputs.changes_examples == 'true') &&
      (needs.lint.result == 'success') &&
      (needs.tooling.result == 'success' || needs.tooling.result == 'skipped') &&
      (needs.modules.result == 'success' || needs.modules.result == 'skipped')
    name: Check examples build
    permissions:
      actions: read
      checks: write
      contents: read
      id-token: write
    uses: ./.github/workflows/_check_examples.yml
    with:
      branch: ${{ inputs.branch || github.ref }}
    secrets: inherit

  distribution:
    needs:
    - touched
    - lint
    - tooling
    - modules
    if: |
      always() &&
      github.event.pull_request.draft == false &&
      (needs.touched.result == 'success') &&
      (needs.touched.outputs.changes_modules == 'true' || needs.touched.outputs.changes_staged == 'true') &&
      (needs.lint.result == 'success') &&
      (needs.tooling.result == 'success' || needs.tooling.result == 'skipped') &&
      (needs.modules.result == 'success' || needs.modules.result == 'skipped')
    name: Check distribution builds
    permissions:
      actions: read
      checks: write
      contents: read
      id-token: write
    uses: ./.github/workflows/_check_distribution.yml
    with:
      branch: ${{ inputs.branch || github.ref }}
    secrets: inherit
