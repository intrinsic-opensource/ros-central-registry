# This is the single staged pipeline for the repo, built out of the
# reusable workflows in this directory (the _check_*.yml files).

name: ci
run-name: Lint, test tooling, build and test the distribution, and deploy.

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch name to check out for check_distribution.'
        default: 'lyrical.2026-06-08.rcr.1'
        required: true
        type: string
      distribution:
        description: 'Which distribution is the release for (check_ros_release)?'
        required: true
        type: choice
        options:
        - 'lyrical'
        - 'rolling'
        default: 'lyrical'
      date:
        description: 'Release in YYYY-MM-DD, for check_ros_release. Default is 2026-06-08.'
        default: '2026-06-08'
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && format('{0}/{1}/{2}', inputs.branch, inputs.distribution, inputs.date) || (github.event.pull_request.number || github.ref) }}
  cancel-in-progress: true

jobs:

  ## STAGE 1: fast checks, run in parallel.

  lint:
    name: Lint source code
    uses: ./.github/workflows/_check_for_linting_errors.yml
    secrets: inherit

  tooling:
    name: Test tooling
    uses: ./.github/workflows/_check_tooling.yml
    secrets: inherit

  # This diffs against github.base_ref, which only exists for pull_request
  # events -- skipped (not failed) on push/workflow_dispatch, and stage 2
  # below treats that skip as non-blocking.
  bazel_modules:
    name: Check modules
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/_check_bazel_modules.yml
    secrets: inherit

  docs_build:
    name: Check documentation
    uses: ./.github/workflows/_check_docs_build.yml
    secrets: inherit

  ## STAGE 2: Build all distributions and examples

  distribution_compiles:
    name: Check distribution builds
    needs:
    - lint
    - tooling
    - bazel_modules
    - docs_build
    if: |
      always() &&
      needs.lint.result == 'success' &&
      needs.tooling.result == 'success' &&
      needs.docs_build.result == 'success' &&
      (needs.bazel_modules.result == 'success' || needs.bazel_modules.result == 'skipped')
    permissions:
      actions: read
      checks: write
      contents: read
      id-token: write
    uses: ./.github/workflows/_check_distribution_compiles.yml
    with:
      branch: ${{ inputs.branch || github.ref }}
    secrets: inherit


  distribution_examples:
    name: Check examples build
    needs: [distribution_compiles]
    if: |
      always() &&
      needs.distribution_compiles.result == 'success'
    permissions:
      actions: read
      checks: write
      contents: read
      id-token: write
    uses: ./.github/workflows/_check_distribution_examples.yml
    with:
      branch: ${{ inputs.branch || github.ref }}
    secrets: inherit

  ## STAGE 3: Check all distributions

  test_rmw_fastrtps_cpp:
    name: Test FastDDS
    needs: [distribution_compiles]
    if: |
      always() &&
      needs.distribution_compiles.result == 'success'
    permissions:
      actions: read
      checks: write
      contents: read
      id-token: write
    uses: ./.github/workflows/_check_distribution_tests.yml
    with:
      branch: ${{ inputs.branch || github.ref }}
      rmw: rmw_fastrtps_cpp
    secrets: inherit

  test_rmw_fastrtps_dynamic_cpp:
    name: Test FastDDS (dynamic)
    needs: [distribution_compiles]
    if: |
      always() &&
      needs.distribution_compiles.result == 'success'
    permissions:
      actions: read
      checks: write
      contents: read
      id-token: write
    uses: ./.github/workflows/_check_distribution_tests.yml
    with:
      branch: ${{ inputs.branch || github.ref }}
      rmw: rmw_fastrtps_dynamic_cpp
    secrets: inherit

  test_rmw_cyclonedds_cpp:
    name: Test CycloneDDS
    needs: [distribution_compiles]
    if: |
      always() &&
      needs.distribution_compiles.result == 'success'
    permissions:
      actions: read
      checks: write
      contents: read
      id-token: write
    uses: ./.github/workflows/_check_distribution_tests.yml
    with:
      branch: ${{ inputs.branch || github.ref }}
      rmw: rmw_cyclonedds_cpp
    secrets: inherit

  test_rmw_zenoh_cpp:
    name: Test Zenoh
    needs: [distribution_compiles]
    if: |
      always() &&
      needs.distribution_compiles.result == 'success'
    permissions:
      actions: read
      checks: write
      contents: read
      id-token: write
    uses: ./.github/workflows/_check_distribution_tests.yml
    with:
      branch: ${{ inputs.branch || github.ref }}
      rmw: rmw_zenoh_cpp
    secrets: inherit

  ## STAGE 4: check_ros_release, only once the whole distribution chain
  ## above is known-good.

  ros_release:
    name: Test upstream colcon
    needs:
    - distribution_examples
    - test_rmw_fastrtps_cpp
    - test_rmw_fastrtps_dynamic_cpp
    - test_rmw_cyclonedds_cpp
    - test_rmw_zenoh_cpp
    permissions:
      pull-requests: write
      contents: write
    uses: ./.github/workflows/_check_ros_release.yml
    with:
      distribution: ${{ inputs.distribution || 'lyrical' }}
      date: ${{ inputs.date || '2026-06-08' }}
    secrets: inherit

  ## STAGE 5: deploy docs + notify the RCR-UI, gated on everything above.

  deploy:
    name: Push to github pages
    needs: ros_release
    permissions:
      contents: write
    uses: ./.github/workflows/_check_deploy.yml
    secrets: inherit
