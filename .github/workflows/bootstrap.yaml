# Called by rosdistro when a release is tagged with a new <release>. It
# bootstraps a new distribution release creating both <release> and
# <release>.rcr.0 versions of modules for rosdistro, ros_base, ros_core,
# simulation, perception, desktop and desktop_full modules. For each
# <version> of each ROS release it creates modules with <version> and
# <version>rcr.0, by carrying over patches from the most recent release.

