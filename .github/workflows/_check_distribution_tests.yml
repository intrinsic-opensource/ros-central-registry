# Reusable workflow: Test a given OS / bazel version against a RMW.

name: _check_distribution_tests

on:
  workflow_call:
    inputs:
      branch:
        description: 'Branch or ref to check out.'
        required: true
        type: string
      rmw:
        description: 'RMW implementation to build and test, e.g. rmw_fastrtps_cpp.'
        required: true
        type: string

env:
  ANDROID_HOME: ""

jobs:
  checkout-setup-build-test:
    permissions:
      actions: read
      checks: write
      contents: read
      id-token: write
    name: test_${{ matrix.ros }}_${{ matrix.variant }}_${{ matrix.bazel }}_${{ matrix.os }}_${{ inputs.rmw }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: workspace
        shell: bash
    env:
      USE_BAZEL_VERSION: ${{ matrix.bazel }}
    strategy:
      fail-fast: false
      matrix:
        bazel:
        - 8.5.1
        - 9.1.1
        ros:
        - lyrical.2026-06-08.rcr.1
        variant:
        - perception
        os:
        - ubuntu-26.04
        - ubuntu-26.04-arm
        - macos-26-intel
        - macos-26
    steps:

    # Setup bazel with controlled caching
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        fetch-depth: 1
        ref: ${{ inputs.branch }}

    # Setup auth to allow pushing to the remote cache.
    - name: Authenticate to Google Cloud
      uses: "google-github-actions/auth@v3"
      with:
        workload_identity_provider: projects/771457463613/locations/global/workloadIdentityPools/github-automation/providers/build-dev
        service_account: github-automation-bot@gha-intrinsic-opensource-rcr.iam.gserviceaccount.com
        create_credentials_file: true

    # Setup bazel with controlled caching that is invariant to RMW implementation.
    - name: Setup Bazel
      uses: bazel-contrib/setup-bazel@0.19.0
      with:
        bazelisk-cache: true
        disk-cache: ${{ matrix.ros }}_${{ matrix.variant }}_${{ matrix.bazel }}_${{ matrix.os }}
        repository-cache: true

    # Prepare the bazel workspace
    - name: Prepare workspace
      id: prepare_workspace
      working-directory: .
      run: |
        bazel run //tools/ci:setup_workspace -- --release=${{ matrix.ros }} --tmpdir "$RUNNER_TEMP"

    # Run the distribution test for the implementation.
    - name: Test (${{ inputs.rmw }})
      id: test
      run: |
        if [ "${{ inputs.rmw }}" = "rmw_zenoh_cpp" ]; then
          # `bazel run` and `bazel test` can't run concurrently against the
          # same output base -- they serialize on Bazel's single command
          # lock. Simply backgrounding `bazel run @rmw_zenoh_cpp//:rmw_zenohd &`
          # right before `bazel test` races the two for that lock: whenever
          # `bazel test` won (common under CI load), the router's `bazel
          # run` client sat blocked for the entire test run and was killed
          # by the EXIT trap before ever starting rmw_zenohd -- silently
          # leaving every zenoh session in this step routerless (each
          # rmw_zenoh_cpp context logs a warning and carries on without
          # discovery) rather than failing loudly. Resolve the router to a
          # plain script up front via `--script_path` (which only builds
          # and writes the script, then returns -- it never leaves a
          # command holding the lock) and launch that directly, so it no
          # longer contends with `bazel test` for the lock at all.
          bazel build --config ci @rmw_zenoh_cpp//:rmw_zenohd
          bazel run --config ci @rmw_zenoh_cpp//:rmw_zenohd --script_path="$PWD/run_zenohd.sh"
          ./run_zenohd.sh >zenohd-stdout.log 2>zenohd-stderr.log &
          ZENOHD_PID=$!
          trap "kill $ZENOHD_PID 2>/dev/null || true" EXIT
          router_ready=false
          for i in $(seq 1 30); do
            if nc -z 127.0.0.1 7447 2>/dev/null; then
              router_ready=true
              break
            fi
            if ! kill -0 $ZENOHD_PID 2>/dev/null; then
              break
            fi
            sleep 1
          done
          if [ "$router_ready" != "true" ]; then
            echo "rmw_zenohd never started listening on 7447; see zenohd-stderr.log" >&2
            cat zenohd-stderr.log >&2
            exit 1
          fi
        fi
        bazel test --config ci --config=${{ matrix.variant }} --test_env=RMW_IMPLEMENTATION=${{ inputs.rmw }} 2>&1 | tee ${{ inputs.rmw }}.test.log || test_status=$?
        if [ -d bazel-testlogs ]; then
          find -L bazel-testlogs -name "*.xml" -print0 | tar -czf ${{ matrix.ros }}_${{ matrix.variant }}_${{ matrix.bazel }}_${{ matrix.os }}_${{ inputs.rmw }}.xml.tar.gz --null -T - || true
          find -L bazel-testlogs -name "*.log" -print0 | tar -czf ${{ matrix.ros }}_${{ matrix.variant }}_${{ matrix.bazel }}_${{ matrix.os }}_${{ inputs.rmw }}.log.tar.gz --null -T - || true
        fi
        exit ${test_status:-0}
    - name: Update status badge (${{ inputs.rmw }})
      uses: Schneegans/dynamic-badges-action@v1.8.0
      with:
        auth: ${{ secrets.STATUS_BADGE_SECRET }}
        gistID: f796805a77e0f05cc837b18e60142773
        filename: ${{ matrix.ros }}_${{ matrix.variant }}_${{ matrix.bazel }}_${{ matrix.os }}_test_${{ inputs.rmw }}.json
        label: ${{ matrix.bazel }}
        message: ${{ steps.test.outcome == 'success' && '✓' || 'x' }}
        color: ${{ steps.test.outcome == 'success' && 'green' || 'red' }}
      if: always() # TODO(fix)

    - name: Test logs
      uses: actions/upload-artifact@v7
      with:
        name: Test logs ${{ matrix.ros }}_${{ matrix.variant }}_${{ matrix.bazel }}_${{ matrix.os }}_${{ inputs.rmw }}
        path: |
          workspace/MODULE.bazel
          workspace/.bazelrc
          workspace/*.xml.tar.gz
          workspace/*.log.tar.gz
          workspace/*.log
      if: always()
