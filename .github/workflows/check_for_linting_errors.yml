name: check_for_linting_errors
run-name: Checks that there are no buildifier linting errors

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  ANDROID_HOME: ""

jobs:
  check_for_linting_errors:
    name: Lint all Bazel files
    runs-on: ubuntu-26.04
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - name: Setup buildifier
      uses: jbajic/setup-buildifier@v1
      with:
        version: 8.5.1
    - name: Run buildifier
      run: |
        buildifier -mode check -r .
    - name: Update status badges
      uses: Schneegans/dynamic-badges-action@v1.7.0
      with:
        auth: ${{ secrets.STATUS_BADGE_SECRET }}
        gistID: f796805a77e0f05cc837b18e60142773
        filename: linting.json
        label: linting
        message: ${{ job.status == 'success' && '✓' || 'x' }}
        color: ${{ job.status == 'success' && 'green' || 'red' }}
      if: always() # TODO(fix)
