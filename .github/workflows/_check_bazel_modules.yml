# Reusable workflow: checks that changes to Bazel modules abide by certain
# rules. Called (never triggered directly) from ci.yaml as part of the
# stage-1 fail-fast gate, and from weekly_rollup.yml to check the rollup's
# own diff against the same append-only guardrail enforced on human PRs.
# This diffs against a base ref (github.base_ref for pull_request events,
# or an explicit `base_ref` input for schedule/workflow_dispatch callers
# like weekly_rollup.yml that have no github.base_ref of their own).

name: _check_bazel_modules

on:
  workflow_call:
    inputs:
      base_ref:
        description: >
          Git ref to diff against. Defaults to github.base_ref, which is
          only set for pull_request events -- non-PR callers (e.g. a
          scheduled rollup diffing its branch against main) must pass this
          explicitly.
        required: false
        type: string
        default: ""

env:
  ANDROID_HOME: ""

permissions:
  contents: read
  pull-requests: write # to post/update the module-diff comment below.

jobs:
  check_bazel_modules:
    name: Check ${{ matrix.directory }}
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        directory: ["modules", "bcr_staging/modules"]
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        fetch-depth: 0 # must be zero for 'git diff' to work below.
    - name: Setup Bazel
      uses: bazel-contrib/setup-bazel@0.19.0
      with:
        bazelisk-cache: true
        disk-cache: false
        repository-cache: true
    - name: Generate PR diff and old metadata files
      run: |
        BASE_REF="${{ inputs.base_ref || github.base_ref }}"

        # Generate the diff name-status file
        git diff --name-status "origin/$BASE_REF...HEAD" > /tmp/diff_status.txt

        # Extract the old versions of any modified metadata.json or MODULE.bazel files under the matrix directory
        mkdir -p /tmp/old_metadata
        git diff --name-only "origin/$BASE_REF...HEAD" | grep -E "^${{ matrix.directory }}/[^/]*/metadata.json$|^${{ matrix.directory }}/[^/]*/[^/]*/MODULE.bazel$" | while read -r file; do
            mkdir -p "/tmp/old_metadata/$(dirname "$file")"
            git show "origin/$BASE_REF:$file" > "/tmp/old_metadata/$file" || true
        done
    - name: Run PR modules check
      run: |
        bazel run //tools/ci:check_pr_modules -- \
            --diff-status /tmp/diff_status.txt \
            --old-metadata-dir /tmp/old_metadata \
            --directory "${{ matrix.directory }}"
    - name: Generate module diff
      # Always runs, even if the check above failed -- that's exactly when
      # seeing what a new module version actually changed is most useful.
      if: always()
      run: |
        bazel run //tools/ci:module_diff -- \
            --diff-status /tmp/diff_status.txt \
            --directory "${{ matrix.directory }}" \
            --output /tmp/module_diff.md
    - name: Write module diff to job summary
      # Always runs, including for fork PRs: unlike the PR comment below,
      # writing to GITHUB_STEP_SUMMARY needs no token permissions at all,
      # so this is the one place a fork PR's module diff is guaranteed to
      # be visible for review.
      if: always()
      run: |
        if [ -s /tmp/module_diff.md ]; then
          echo "### Module diff (${{ matrix.directory }})" >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/module_diff.md >> "$GITHUB_STEP_SUMMARY"
        fi
    - name: Post module diff to PR
      # Only meaningful on a real pull_request event -- weekly_rollup.yml
      # calls this workflow before any PR exists (see the comment at the
      # top of this file), so there's nothing to comment on there. Also
      # skipped for fork PRs: GitHub forces GITHUB_TOKEN to read-only for
      # pull_request events triggered from a fork, regardless of the
      # `permissions:` block above, so the comment API call would just
      # fail with "Resource not accessible by integration". The job
      # summary step above still surfaces the diff in that case.
      if: |
        always() && github.event_name == 'pull_request' &&
        (github.event.pull_request.head.repo.full_name || github.repository) == 'intrinsic-opensource/ros-central-registry'
      uses: actions/github-script@v9
      with:
        script: |
          const fs = require('fs');
          const path = '/tmp/module_diff.md';
          if (!fs.existsSync(path)) return;
          const diff = fs.readFileSync(path, 'utf8').trim();
          if (!diff) return;

          // Marker scopes the comment to this matrix directory, so
          // "modules" and "bcr_staging/modules" each get their own
          // comment, and re-runs update the same comment instead of
          // piling up duplicates.
          const marker = `<!-- module-diff: ${{ matrix.directory }} -->`;
          const body = `${marker}\n${diff}`;

          const { data: comments } = await github.rest.issues.listComments({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
          });
          const existing = comments.find((c) => c.body.includes(marker));

          if (existing) {
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: existing.id,
              body,
            });
          } else {
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
          }
    - name: Update status badges
      uses: Schneegans/dynamic-badges-action@v1.8.0
      with:
        auth: ${{ secrets.STATUS_BADGE_SECRET }}
        gistID: f796805a77e0f05cc837b18e60142773
        filename: modules.json
        label: modules
        message: ${{ job.status == 'success' && '✓' || 'x' }}
        color: ${{ job.status == 'success' && 'green' || 'red' }}
      if: always() && github.ref == 'refs/heads/main' && github.event_name == 'push'
